title: 进阶场景 /anything提取回显串联第二步
configelements: !include 'common/env/env.yaml'
children:
  - title: 第一步 POST /anything 提取 action
    testclass: http
    config:
      method: POST
      path: /anything
      headers:
        Content-Type: application/json
      body:
        action: trace
        channel: gitlab-ci
    validators:
      - { testclass: status, expected: 200, rule: equals }
      - { testclass: json, field: '$.json.channel', expected: gitlab-ci, rule: equals }
    extractors:
      - { testclass: json, field: '$.json.action', ref_name: trace_action }
  - title: 第二步 GET /anything 引用提取变量
    testclass: http
    config:
      method: GET
      path: /anything
      query:
        echo: ${trace_action}
    validators:
      - { testclass: status, expected: 200, rule: equals }
      - { testclass: json, field: '$.args.echo', expected: '${trace_action}', rule: equals }
