title: 进阶场景 /base64响应体解码文本校验
configelements: !include 'common/env/env.yaml'
children:
  - title: GET /base64 返回解码后的明文
    testclass: http
    config:
      method: GET
      path: /base64/SGVsbG8gV29ybGQ=
    validators:
      - { testclass: status, expected: 200, rule: equals }
      - { testclass: result, expected: Hello World, rule: contains }
