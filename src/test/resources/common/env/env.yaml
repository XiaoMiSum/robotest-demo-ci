# 平台默认环境（envFilePath 缺省值 common/env/env.yaml）
# 首条无 ref_name 的 http 元件即默认配置：platform 省略默认端口 → baseUrl https://httpbin.org
- testclass: http
  config:
    protocol: https
    host: httpbin.org
    port: 443
# 带 ref_name 的第二条：验证平台导入时按 ref_name 覆盖式合并（不影响默认请求）
- testclass: http
  ref_name: httpbin_alt
  config:
    protocol: https
    host: httpbin.org
    port: 443
    headers:
      X-Demo-Env: robotest
