title: 基础POST /post 表单数据回显校验
configelements: !include 'common/env/env.yaml'
children:
  - title: POST /post form 表单原样回显
    testclass: http
    config:
      method: POST
      path: /post
      data:
        form_key: form_value
    validators:
      - { testclass: status, expected: 200, rule: equals }
      - { testclass: json, field: '$.form.form_key', expected: form_value, rule: equals }
