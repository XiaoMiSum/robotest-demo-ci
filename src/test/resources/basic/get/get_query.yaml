title: 基础GET /get 查询参数透传校验
configelements: !include 'common/env/env.yaml'
children:
  - title: GET /get 携带 query 参数原样回显
    testclass: http
    config:
      method: GET
      path: /get
      query:
        demo: robotest
        source: gitlab
    validators:
      - { testclass: status, expected: 200, rule: equals }
      - { testclass: json, field: '$.args.demo', expected: robotest, rule: equals }
      - { testclass: json, field: '$.args.source', expected: gitlab, rule: equals }
