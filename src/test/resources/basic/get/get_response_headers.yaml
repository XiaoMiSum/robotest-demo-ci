title: 基础GET /response-headers 响应头与JSON双通道校验
configelements: !include 'common/env/env.yaml'
children:
  - title: GET /response-headers 返回自定义响应头
    testclass: http
    config:
      method: GET
      path: /response-headers
      query:
        freeform: hello
    validators:
      - { testclass: status, expected: 200, rule: equals }
      - { testclass: http, field: 'header.freeform', expected: hello, rule: equals }
      - { testclass: json, field: '$.freeform', expected: hello, rule: equals }
